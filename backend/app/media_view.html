<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员照片核验</title>
<style nonce="__NONCE__">body{font-family:system-ui;max-width:600px;margin:40px auto;padding:20px}input,button{display:block;margin:12px 0;padding:12px;box-sizing:border-box;width:100%}img{max-width:100%}button{background:#F25B15;color:white;border:0}</style>
<h1>管理员照片核验</h1><p>照片仅供授权管理员核验。请确认当前域名是学校服务地址。登录信息只用于本次查看，不保存。</p>
<form id="login"><input id="account" placeholder="管理员账号" autocomplete="username" required><input id="password" type="password" placeholder="管理员密码" autocomplete="current-password" required><button>登录并查看</button></form><p id="status" role="status"></p><img id="photo" alt="预约核验照片">
<script nonce="__NONCE__">let objectUrl=null;document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const status=document.getElementById('status');status.textContent='正在验证';const password=document.getElementById('password');try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:document.getElementById('account').value,password:password.value})});password.value='';const data=await r.json();if(!r.ok||data.user.role!=='admin')throw Error('请使用有效管理员账号');const image=await fetch('/api/media/__MEDIA_ID__',{headers:{Authorization:'Bearer '+data.access_token}});if(!image.ok)throw Error('照片不可访问、已过期或账号需先修改初始密码');if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(await image.blob());document.getElementById('photo').src=objectUrl;status.textContent='已鉴权，访问已记录';}catch(error){password.value='';status.textContent=error.message;}});</script></html>
