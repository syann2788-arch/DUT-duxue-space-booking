<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笃学书院空间预约</title>
<style>
:root {
  --purple: #6b2d8e;
  --purple-light: #8e5db5;
  --purple-lighter: #f3edf8;
  --purple-bg: #faf7fc;
  --gray-bg: #f3f4f6;
  --card-shadow: 0 1px 6px rgba(0,0,0,.05);
  --radius: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; background: var(--gray-bg); min-height: 100vh; color: #333; }
.hidden { display: none !important; }

/* ── Header ── */
.header { background: linear-gradient(135deg, #5a1e7a, var(--purple)); color: #fff; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
.header h1 { font-size: 19px; font-weight: 600; }
.header .uinfo { font-size: 12px; opacity: .8; }
.header button { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.35); color: #fff; padding: 5px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.header button:hover { background: rgba(255,255,255,.2); }

/* ── Tabs ── */
.tabs { display: flex; background: #fff; border-bottom: 1px solid #e5e5e5; }
.tab { flex: 1; text-align: center; padding: 13px 0; font-size: 14px; color: #888; cursor: pointer; border-bottom: 3px solid transparent; transition: .15s; }
.tab.active { color: var(--purple); font-weight: 700; border-bottom-color: var(--purple); }

/* ── Card ── */
.card { background: #fff; margin: 10px 14px; padding: 16px; border-radius: var(--radius); box-shadow: var(--card-shadow); }

/* ── Login/Register ── */
.auth-box { max-width: 380px; margin: 80px auto; padding: 36px 32px; background: #fff; border-radius: 16px; box-shadow: 0 2px 20px rgba(0,0,0,.07); text-align: center; }
.auth-box .logo { font-size: 42px; margin-bottom: 6px; }
.auth-box h2 { color: var(--purple); margin-bottom: 24px; font-size: 20px; }
.auth-box input { width: 100%; padding: 11px 14px; margin-bottom: 12px; border: 1.5px solid #e0dce4; border-radius: 8px; font-size: 14px; transition: border .2s; background: var(--purple-bg); }
.auth-box input:focus { outline: none; border-color: var(--purple-light); background: #fff; }
.btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin-bottom: 8px; font-weight: 600; }
.btn-purple { background: var(--purple); color: #fff; }
.btn-purple:hover { background: #5a2478; }
.btn-outline { background: #fff; color: var(--purple); border: 1.5px solid var(--purple); }
.btn-sm { padding: 7px 16px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; font-weight: 500; }

/* ── Legend ── */
.legend { display: flex; justify-content: center; gap: 16px; padding: 10px; font-size: 12px; color: #888; }
.legend span { display: flex; align-items: center; gap: 4px; }
.legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }

/* ── Floor Plan ── */
.floor-plan { padding: 8px 14px; }
.corridor { text-align: center; color: #aaa; font-size: 12px; padding: 8px 0; border-top: 2px dashed #e0dce4; border-bottom: 2px dashed #e0dce4; margin: 8px 0; position: relative; }
.corridor .end { position: absolute; top: 50%; transform: translateY(-50%); font-size: 11px; color: #bbb; }
.corridor .end.left { left: 8px; }
.corridor .end.right { right: 8px; }
.room-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 4px 0; }
.room-cell { width: 108px; padding: 8px 5px; border-radius: 10px; text-align: center; cursor: pointer; transition: transform .12s; border: 1.5px solid transparent; }
.room-cell:hover { transform: scale(1.03); }
.room-cell.nonpub { background: #f0f0f0; cursor: default; }
.room-cell.reservable { background: #f3edf8; border-color: #d5c4e8; }
.room-cell.public { background: #e8f0fe; border-color: #c5d5f8; }
.room-cell .code { font-size: 13px; font-weight: 700; color: #444; }
.room-cell .name { font-size: 11px; color: #777; margin: 2px 0; }
.room-cell .tag { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 3px; color: #fff; margin-top: 1px; }
.tag-res { background: var(--purple); }
.tag-pub { background: #5b8def; }
.tag-cou { background: #e0556a; }
.tag-non { background: #aaa; }
.row-label { text-align: center; font-size: 11px; color: #aaa; margin: 2px 0; }
.entrance-badge { display: inline-block; background: var(--purple); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 3px; margin-left: 6px; }

/* ── Room List ── */
.room-list-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 16px; cursor: pointer; }
.room-list-item:hover { background: var(--purple-lighter); }
.room-list-item+.room-list-item { border-top: 1px solid #f0f0f0; }
.room-list-item .left { display: flex; flex-direction: column; }
.room-list-item .code { font-size: 15px; font-weight: 700; color: var(--purple); }
.room-list-item .cate { font-size: 12px; color: #999; }
.room-list-item .arrow { color: #ccc; font-size: 16px; }

/* ── Time Slot Grid ── */
.date-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-bottom: 16px; }
.date-nav .arr { font-size: 26px; color: var(--purple); cursor: pointer; padding: 0 10px; user-select: none; }
.date-nav .date-text { font-size: 17px; font-weight: 600; }
.slot-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.slot-cell { width: calc(25% - 6px); padding: 14px 4px; text-align: center; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; border: 2px solid transparent; transition: .12s; }
.slot-avail { background: #faf4fb; border-color: #e0cce8; color: #5a2478; }
.slot-avail:hover { background: #f0e0f6; }
.slot-taken { background: #f5f5f5; border-color: #eaeaea; color: #ccc; cursor: not-allowed; }
.slot-picked { background: var(--purple); border-color: var(--purple); color: #fff; }
.slot-desc { font-size: 10px; display: block; font-weight: 400; margin-top: 1px; opacity: .7; }
.slot-picked .slot-desc { opacity: 1; }
.summary { background: #fef3e4; padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #c2780a; margin-bottom: 12px; }
.rules { font-size: 12px; color: #aaa; line-height: 1.9; margin-bottom: 14px; }
.full-btn { width: 100%; padding: 13px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; color: #fff; font-weight: 600; }
.full-btn:disabled { background: #ccc !important; cursor: not-allowed; }

/* ── Status ── */
.status-free { color: #4caf50; font-weight: 600; }
.status-busy { color: #ff9800; font-weight: 600; }
.status-crowded { color: #e0556a; font-weight: 600; }

/* ── My Reservations ── */
.res-card { padding: 14px 0; border-bottom: 1px solid #f2f2f2; }
.res-card .row { display: flex; justify-content: space-between; align-items: center; }
.res-card .rname { font-size: 15px; font-weight: 700; }
.res-card .rstat { font-size: 11px; padding: 3px 10px; border-radius: 4px; font-weight: 500; }
.res-card .rtime { font-size: 13px; color: #999; margin: 4px 0; }
.res-card .act-row { margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; }
.st-active { background: #f0e6f6; color: var(--purple); }
.st-checked { background: #e8f5e9; color: #2e7d32; }
.st-missed { background: #ffebee; color: #c62828; }
.st-cancelled { background: #f5f5f5; color: #999; }

/* ── Admin ── */
.admin-block { margin: 10px 14px; }
.admin-block h3 { font-size: 15px; color: #444; margin-bottom: 8px; }
.admin-stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
.admin-stat-row .card { flex: 1; text-align: center; padding: 14px; margin: 0; }
.admin-stat-row .num { font-size: 28px; font-weight: 700; color: var(--purple); }
.admin-stat-row .lbl { font-size: 11px; color: #999; }
.user-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
.user-row .ban-tag { font-size: 10px; background: #e0556a; color: #fff; padding: 2px 6px; border-radius: 3px; margin-left: 6px; }

/* ── Toast ── */
.toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%); background: rgba(0,0,0,.78); color: #fff; padding: 12px 28px; border-radius: 10px; font-size: 14px; z-index: 999; pointer-events: none; white-space: nowrap; }

/* ── Modal ── */
.modal-mask { position: fixed; top:0;left:0;right:0;bottom:0; background: rgba(0,0,0,.35); z-index: 99; display: flex; align-items: center; justify-content: center; }
.modal-box { background: #fff; border-radius: 14px; padding: 22px; width: 340px; text-align: left; max-height: 85vh; overflow-y: auto; }
.modal-box h3 { color: var(--purple); font-size: 18px; margin-bottom: 4px; }
.modal-box .subtitle { font-size: 12px; color: #999; margin-bottom: 10px; }
.modal-box p { font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="loginScreen">
  <div class="auth-box">
    <div class="logo">🏫</div>
    <h2>笃学书院 · 空间预约</h2>
    <input id="loginId" placeholder="学号 / 手机号" autocomplete="off">
    <input id="loginPass" type="password" placeholder="密码">
    <button class="btn btn-purple" onclick="doLogin()">登 录</button>
    <button class="btn btn-outline" onclick="showRegister()">注册新账号</button>
  </div>
</div>

<!-- ── Register ── -->
<div id="registerScreen" class="hidden">
  <div class="auth-box">
    <h2>注册账号</h2>
    <input id="regId" placeholder="学号（数字）">
    <input id="regName" placeholder="姓名">
    <input id="regPhone" placeholder="手机号">
    <input id="regClass" placeholder="班级（如：计科2401）">
    <input id="regPass" type="password" placeholder="密码（至少6位）">
    <button class="btn btn-purple" onclick="doRegister()">注 册</button>
    <button class="btn btn-outline" onclick="showLogin()">返回登录</button>
  </div>
</div>

<!-- ── Main App ── -->
<div id="appScreen" class="hidden">
  <div class="header">
    <div>
      <h1>笃学书院空间预约</h1>
      <div class="uinfo" id="headerUser"></div>
    </div>
    <div>
      <button id="adminBtn" style="margin-right:6px" onclick="switchTab('admin')" class="hidden">管理</button>
      <button onclick="doLogout()">退出</button>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="rooms" onclick="switchTab('rooms')">空间导览</div>
    <div class="tab" data-tab="my" onclick="switchTab('my')">我的预约</div>
    <div class="tab admin-tab hidden" data-tab="admin" onclick="switchTab('admin')">管理后台</div>
  </div>

  <!-- Rooms -->
  <div id="tabRooms">
    <div class="legend">
      <span><span class="dot" style="background:var(--purple)"></span>可预约</span>
      <span><span class="dot" style="background:#5b8def"></span>公开空间</span>
      <span><span class="dot" style="background:#e0556a"></span>需辅导员</span>
      <span><span class="dot" style="background:#aaa"></span>不可互动</span>
    </div>
    <div class="floor-plan" id="floorPlan"></div>
    <div class="card" style="margin-top:10px;font-weight:700;font-size:15px;color:#444">空间列表</div>
    <div id="roomList"></div>
  </div>

  <!-- My -->
  <div id="tabMy" class="hidden">
    <div style="display:flex;background:#fff;border-bottom:1px solid #e5e5e5">
      <div class="tab active" data-filter="all" onclick="filterMy('all')">全部</div>
      <div class="tab" data-filter="active" onclick="filterMy('active')">待签到</div>
      <div class="tab" data-filter="checked_in" onclick="filterMy('checked_in')">已签到</div>
      <div class="tab" data-filter="missed" onclick="filterMy('missed')">违约</div>
    </div>
    <div id="myReservations" style="padding:0 14px"></div>
  </div>

  <!-- Admin -->
  <div id="tabAdmin" class="hidden">
    <div class="admin-block">
      <h3>📊 概况</h3>
      <div id="adminStats" class="admin-stat-row"></div>
      <h3>👥 用户管理</h3>
      <div id="adminUsers"></div>
    </div>
  </div>
</div>

<!-- ── Room Modal ── -->
<div id="roomModal" class="modal-mask hidden" onclick="if(event.target===this)closeRoomModal()">
  <div class="modal-box" id="roomModalContent"></div>
</div>

<!-- ── Toast ── -->
<div id="toast" class="toast hidden"></div>

<script>
const API = 'http://localhost:8000/api';
let token = '';
let user = null;
let roomsData = [];
let myReservations = [];
let currentFilter = 'all';

function api(path, method='GET', body=null) {
  const opts = { method, headers: {} };
  if (token) opts.headers['Authorization'] = 'Bearer ' + token;
  if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  return fetch(API + path, opts).then(r => {
    if (!r.ok) return r.json().then(e => { throw new Error(e.detail || '请求失败') });
    return r.json();
  });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), 2200);
}

function showLogin() {
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('registerScreen').classList.add('hidden');
}
function showRegister() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('registerScreen').classList.remove('hidden');
}

// ── Auth ──
async function doLogin() {
  const sid = document.getElementById('loginId').value.trim();
  const pw = document.getElementById('loginPass').value;
  if (!sid || !pw) return toast('请填写完整');
  try {
    const res = await api('/auth/login', 'POST', { student_id: sid, password: pw });
    token = res.access_token; user = res.user;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('registerScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('headerUser').textContent = user.name + ' | ' + user.student_id;
    if (user.role === 'admin') {
      document.getElementById('adminBtn').classList.remove('hidden');
      document.querySelector('.admin-tab').classList.remove('hidden');
    }
    await loadRooms();
    await loadMyReservations();
    switchTab('rooms');
    toast('登录成功');
  } catch(e) { toast(e.message); }
}

async function doRegister() {
  const data = {
    student_id: document.getElementById('regId').value.trim(),
    name: document.getElementById('regName').value.trim(),
    phone: document.getElementById('regPhone').value.trim(),
    class_name: document.getElementById('regClass').value.trim(),
    password: document.getElementById('regPass').value,
  };
  if (!data.student_id || !data.name || !data.phone || !data.class_name || !data.password) return toast('请填写所有字段');
  if (data.password.length < 6) return toast('密码至少6位');
  try {
    const res = await api('/auth/register', 'POST', data);
    token = res.access_token; user = res.user;
    document.getElementById('loginScreen').classList.add('hidden');
    document.getElementById('registerScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('headerUser').textContent = user.name + ' | ' + user.student_id;
    await loadRooms();
    await loadMyReservations();
    switchTab('rooms');
    toast('注册成功');
  } catch(e) { toast(e.message); }
}

function doLogout() {
  token = ''; user = null; myReservations = [];
  document.getElementById('appScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

// ── Tabs ──
function switchTab(name) {
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  const el = document.querySelector(`.tabs [data-tab="${name}"]`);
  if (el) el.classList.add('active');
  ['tabRooms','tabMy','tabAdmin'].forEach(id => document.getElementById(id).classList.add('hidden'));
  if (name === 'rooms') document.getElementById('tabRooms').classList.remove('hidden');
  else if (name === 'my') document.getElementById('tabMy').classList.remove('hidden');
  else if (name === 'admin') { document.getElementById('tabAdmin').classList.remove('hidden'); loadAdmin(); }
}

// ── Rooms ──
async function loadRooms() {
  try { roomsData = await api('/rooms'); } catch { roomsData = []; }
  renderFloorPlan();
  renderRoomList();
}

function renderFloorPlan() {
  // Left = entrance; Top row = south side (致知堂 row); Bottom row = north side
  const topRow = ['L001','A101','W001','A103','C103','C101'];
  const bottomRow = ['C104','C102','B102','B101','A106','A105','A104','A102'];
  const map = {};
  roomsData.forEach(r => map[r.room_code] = r);

  function cell(code) {
    const r = map[code];
    if (!r) return `<div class="room-cell nonpub"><div class="code">${code}</div></div>`;
    let tag, cls = 'nonpub';
    if (r.can_reserve) {
      cls = 'reservable';
      tag = r.who_can_reserve === 'counselor'
        ? '<div class="tag tag-cou">辅导员</div>'
        : '<div class="tag tag-res">可预约</div>';
    } else if (r.is_public) {
      cls = 'public';
      const s = {free:'空闲',busy:'较满',crowded:'已满'}[r.public_status]||'未知';
      tag = `<div class="tag tag-pub">${s}</div>`;
    } else {
      tag = '<div class="tag tag-non">非公共</div>';
    }
    const click = (r.can_reserve || r.is_public) ? `onclick="openRoom(${r.id})"` : '';
    return `<div class="room-cell ${cls}" ${click}><div class="code">${r.room_code}</div><div class="name">${r.name}</div>${tag}</div>`;
  }

  document.getElementById('floorPlan').innerHTML = `
    <div class="row-label">致知堂侧（上方） <span class="entrance-badge">← 正门</span></div>
    <div class="room-row">${topRow.map(cell).join('')}</div>
    <div class="corridor"><span class="end left">西</span>═══ 主通道 ═══<span class="end right">东</span></div>
    <div class="row-label">韵音阁侧（下方）</div>
    <div class="room-row">${bottomRow.map(cell).join('')}</div>
  `;
}

function renderRoomList() {
  const reservable = roomsData.filter(r => r.can_reserve && r.who_can_reserve === 'all');
  const publics = roomsData.filter(r => r.is_public);
  let html = '';
  reservable.forEach(r => {
    html += `<div class="room-list-item card" style="margin:0 14px" onclick="openRoom(${r.id})"><div class="left"><div class="code">${r.room_code} ${r.name}</div><div class="cate">${r.category}${r.has_instruments?' · 有乐器':''}</div></div><div class="arrow">›</div></div>`;
  });
  html += '<div class="card" style="margin-top:12px;font-weight:700;font-size:15px;color:#444">公开空间（无需预约）</div>';
  publics.forEach(r => {
    const s = {free:'空闲',busy:'较满',crowded:'已满'}[r.public_status]||'未知';
    html += `<div class="room-list-item card" style="margin:0 14px" onclick="openRoom(${r.id})"><div class="left"><div class="code">${r.room_code} ${r.name}</div><div class="cate">${s}${r.has_fridge?' · 有冰箱':''}</div></div><div class="arrow">›</div></div>`;
  });
  document.getElementById('roomList').innerHTML = html || '<div style="text-align:center;padding:40px;color:#ccc">暂无空间</div>';
}

function openRoom(id) {
  const r = roomsData.find(x => x.id === id);
  if (!r) return;

  if (r.is_public) {
    let html = `<h3>${r.room_code} ${r.name}</h3><p class="subtitle">${r.category}${r.has_fridge?' · 有冰箱':''} · 公开空间，无需预约</p><p>${r.description||''}</p>`;
    html += `<p style="margin-top:10px">当前状态：<span class="status-${r.public_status||'free'}">${{free:'空闲',busy:'较满',crowded:'已满'}[r.public_status]||'未知'}</span></p>`;
    if (user && user.role === 'admin') {
      html += `<div style="margin-top:10px;display:flex;gap:6px"><button class="btn-sm" style="background:#4caf50;color:#fff" onclick="setPublicStatus(${r.id},'free')">空闲</button><button class="btn-sm" style="background:#ff9800;color:#fff" onclick="setPublicStatus(${r.id},'busy')">较满</button><button class="btn-sm" style="background:#e0556a;color:#fff" onclick="setPublicStatus(${r.id},'crowded')">已满</button></div>`;
    }
    html += `<div style="margin-top:14px;text-align:center"><button class="btn btn-outline" style="width:auto;padding:9px 36px" onclick="closeRoomModal()">关 闭</button></div>`;
    document.getElementById('roomModalContent').innerHTML = html;
    document.getElementById('roomModal').classList.remove('hidden');
    return;
  }

  if (!r.can_reserve) {
    document.getElementById('roomModalContent').innerHTML = `<h3>${r.room_code} ${r.name}</h3><p class="subtitle">${r.category}</p><p style="color:#856404;background:#fff3cd;padding:10px;border-radius:8px;margin:10px 0">该空间不对外开放预约</p><div style="text-align:center"><button class="btn btn-outline" style="width:auto;padding:9px 36px" onclick="closeRoomModal()">关 闭</button></div>`;
    document.getElementById('roomModal').classList.remove('hidden');
    return;
  }

  if (r.who_can_reserve === 'counselor' && user.role !== 'counselor' && user.role !== 'admin') {
    document.getElementById('roomModalContent').innerHTML = `<h3>${r.room_code} ${r.name}</h3><p class="subtitle">${r.category}</p><p style="color:#c62828;background:#ffebee;padding:10px;border-radius:8px;margin:10px 0">仅限辅导员预约</p><div style="text-align:center"><button class="btn btn-outline" style="width:auto;padding:9px 36px" onclick="closeRoomModal()">关 闭</button></div>`;
    document.getElementById('roomModal').classList.remove('hidden');
    return;
  }

  showReservation(r);
}

function closeRoomModal() { document.getElementById('roomModal').classList.add('hidden'); }

async function setPublicStatus(roomId, status) {
  try {
    await api(`/admin/rooms/${roomId}/public-status`, 'PUT', { public_status: status });
    toast('状态已更新'); closeRoomModal(); await loadRooms();
  } catch(e) { toast(e.message); }
}

// ── Reservation ──
let currentRoom = null;
let currentDate = new Date();
let selectedSlots = [];
let slotsData = [];

function showReservation(room) { currentRoom = room; currentDate = new Date(); selectedSlots = []; loadSlots(); }

async function loadSlots() {
  const ds = currentDate.toISOString().slice(0,10);
  try { const res = await api(`/rooms/${currentRoom.id}/slots?date=${ds}`); slotsData = res.slots; }
  catch { slotsData = []; }
  selectedSlots = [];
  renderReservation();
}

function renderReservation() {
  const ds = currentDate.toISOString().slice(0,10);
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  let label = ds;
  if (currentDate.toDateString() === today.toDateString()) label += ' 今天';
  else if (currentDate.toDateString() === tomorrow.toDateString()) label += ' 明天';

  let html = `<h3>${currentRoom.room_code} ${currentRoom.name}</h3>`;
  html += `<p class="subtitle">${currentRoom.category} · 开放 8:00-22:00 · 每天仅可预约一个连续时段 · 单次最多4小时</p>`;
  html += `<div class="date-nav"><span class="arr" onclick="changeDate(-1)">&#8249;</span><span class="date-text">${label}</span><span class="arr" onclick="changeDate(1)">&#8250;</span></div>`;
  html += '<div class="slot-grid">';

  slotsData.forEach(s => {
    let cls = s.available ? 'slot-avail' : 'slot-taken';
    if (selectedSlots.includes(s.hour)) cls = 'slot-picked';
    const label = s.label || (String(s.hour).padStart(2,'0')+':00');
    html += `<div class="slot-cell ${cls}" onclick="toggleSlot(${s.hour}, ${s.available})">${label}<span class="slot-desc">${s.available ? '可约' : '已约'}</span></div>`;
  });
  html += '</div>';

  if (selectedSlots.length > 0) {
    const minH = Math.min(...selectedSlots);
    const maxH = Math.max(...selectedSlots);
    html += `<div class="summary">已选：${String(minH).padStart(2,'0')}:00 - ${String(maxH+1).padStart(2,'0')}:00（${selectedSlots.length}小时）</div>`;
  }

  html += `<div class="rules">· 每人每天仅可预约一个连续时段<br>· 单次最多4小时 · 开始后15分钟内需签到<br>· 开始前30分钟可取消 · 累计3次违约禁约7天</div>`;
  html += `<button class="full-btn btn-purple" onclick="submitReservation()" ${selectedSlots.length===0?'disabled':''}>${selectedSlots.length===0?'请选择时间段（点击格子）':'确认预约'}</button>`;
  html += `<button class="btn btn-outline full-btn" style="margin-top:8px" onclick="closeRoomModal()">返回</button>`;

  document.getElementById('roomModalContent').innerHTML = html;
  document.getElementById('roomModal').classList.remove('hidden');
}

function changeDate(delta) {
  const today = new Date(); today.setHours(0,0,0,0);
  const max = new Date(today); max.setDate(today.getDate()+1);
  const d = new Date(currentDate); d.setDate(d.getDate() + delta);
  if (d >= today && d <= max) { currentDate = d; loadSlots(); }
}

function toggleSlot(hour, available) {
  if (!available) return;
  const idx = selectedSlots.indexOf(hour);
  if (idx >= 0) {
    if (idx === 0 || idx === selectedSlots.length - 1) selectedSlots.splice(idx, 1);
    else return toast('只能从两端取消，保持连续');
  } else {
    if (selectedSlots.length === 0) selectedSlots.push(hour);
    else {
      const min = Math.min(...selectedSlots), max = Math.max(...selectedSlots);
      if (hour === min - 1) selectedSlots.unshift(hour);
      else if (hour === max + 1) selectedSlots.push(hour);
      else return toast('请选择连续时间段');
    }
  }
  if (selectedSlots.length > 4) { selectedSlots.pop(); return toast('单次最多4小时'); }
  const ds = currentDate.toISOString().slice(0,10);
  if (myReservations.some(r => r.date === ds && (r.status==='active'||r.status==='checked_in'))) {
    selectedSlots = []; loadSlots(); return toast('当天已有预约，如需修改请先取消');
  }
  renderReservation();
}

async function submitReservation() {
  const min = Math.min(...selectedSlots), max = Math.max(...selectedSlots);
  try {
    await api('/reservations', 'POST', { room_id: currentRoom.id, date: currentDate.toISOString().slice(0,10), start_hour: min, end_hour: max+1 });
    toast('预约成功！'); closeRoomModal(); await loadMyReservations();
  } catch(e) { toast(e.message); }
}

// ── My Reservations ──
async function loadMyReservations() {
  try { myReservations = await api('/reservations/my'); } catch { myReservations = []; }
  renderMyReservations();
}

function filterMy(f) {
  currentFilter = f;
  document.querySelectorAll('#tabMy .tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`#tabMy [data-filter="${f}"]`).classList.add('active');
  renderMyReservations();
}

function renderMyReservations() {
  let list = currentFilter === 'all' ? myReservations : myReservations.filter(r => r.status === currentFilter);
  const stL = {active:'待签到',checked_in:'已签到',missed:'违约',cancelled:'已取消'};
  const stC = {active:'st-active',checked_in:'st-checked',missed:'st-missed',cancelled:'st-cancelled'};
  let html = '';
  list.forEach(r => {
    const rm = r.room || {};
    html += `<div class="res-card"><div class="row"><span class="rname">${rm.room_code||'?'} ${rm.name||''}</span><span class="rstat ${stC[r.status]}">${stL[r.status]}</span></div><div class="rtime">${r.date} ${String(r.start_hour).padStart(2,'0')}:00 - ${String(r.end_hour).padStart(2,'0')}:00（${r.end_hour-r.start_hour}h）</div>`;
    if (r.status === 'active') {
      const now = new Date();
      const start = new Date(r.date+'T'+String(r.start_hour).padStart(2,'0')+':00:00');
      if (now <= new Date(start.getTime()+15*60000)) html += `<div class="act-row"><button class="btn-sm" style="background:var(--purple);color:#fff" onclick="doCheckin(${r.id})">签到</button>`;
      if (now < new Date(start.getTime()-30*60000)) html += `<button class="btn-sm" style="background:#e0556a;color:#fff" onclick="doCancel(${r.id})">取消</button></div>`;
    }
    html += '</div>';
  });
  document.getElementById('myReservations').innerHTML = html || '<div style="text-align:center;padding:60px;color:#ccc">暂无预约记录</div>';
}

async function doCheckin(id) {
  try { await api('/reservations/checkin', 'POST', { reservation_id: id }); toast('签到成功'); await loadMyReservations(); }
  catch(e) { toast(e.message); }
}
async function doCancel(id) {
  if (!confirm('确定取消此预约？')) return;
  try { await api(`/reservations/cancel/${id}`, 'POST'); toast('已取消'); await loadMyReservations(); }
  catch(e) { toast(e.message); }
}

// ── Admin ──
async function loadAdmin() {
  try {
    const users = await api('/admin/users');
    let html = '';
    users.forEach(u => {
      const rl = {student:'学生',counselor:'辅导员',admin:'管理员'}[u.role]||u.role;
      html += `<div class="user-row"><div><span style="font-weight:600">${u.name}</span> <span style="font-size:12px;color:#999">${u.student_id}</span> <span style="font-size:10px;background:#eee;padding:2px 6px;border-radius:3px;margin-left:4px">${rl}</span>${u.banned_until?' <span class="ban-tag">禁约中</span>':''}</div>`;
      if (!u.banned_until) html += `<button class="btn-sm" style="background:#e0556a;color:#fff" onclick="banUser(${u.id},'${u.name}')">禁约</button>`;
      else html += `<button class="btn-sm" style="background:#4caf50;color:#fff" onclick="unbanUser(${u.id})">解禁</button>`;
      html += '</div>';
    });
    document.getElementById('adminStats').innerHTML = `<div class="card"><div class="num">${users.length}</div><div class="lbl">总用户</div></div>`;
    document.getElementById('adminUsers').innerHTML = '<div class="card">'+html+'</div>';
  } catch(e) { console.error(e); }
}

async function banUser(id, name) {
  if (!confirm(`确定禁约 ${name} 7天？`)) return;
  try { await api('/admin/users/ban', 'POST', { user_id: id, days: 7 }); toast('已禁约'); await loadAdmin(); } catch(e) { toast(e.message); }
}
async function unbanUser(id) {
  try { await api(`/admin/users/${id}/unban`, 'POST'); toast('已解禁'); await loadAdmin(); } catch(e) { toast(e.message); }
}
</script>
