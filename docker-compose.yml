services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shuyuan
      POSTGRES_USER: shuyuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuyuan"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://space.example.edu.cn}
      ALLOW_OPEN_REGISTRATION: "false"
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TEMPLATE_SUBMITTED: ${WECHAT_TEMPLATE_SUBMITTED:-}
      WECHAT_TEMPLATE_REVIEW: ${WECHAT_TEMPLATE_REVIEW:-}
      WECHAT_TEMPLATE_REMINDER: ${WECHAT_TEMPLATE_REMINDER:-}
      WECHAT_TEMPLATE_RESTRICTION: ${WECHAT_TEMPLATE_RESTRICTION:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  uploads:
