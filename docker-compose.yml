services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shuyuan
      POSTGRES_USER: shuyuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuyuan"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://space.example.edu.cn}
      REQUIRE_WORKER_HEARTBEAT: "true"
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TEMPLATE_SUBMITTED: ${WECHAT_TEMPLATE_SUBMITTED:-}
      WECHAT_TEMPLATE_REVIEW: ${WECHAT_TEMPLATE_REVIEW:-}
      WECHAT_TEMPLATE_REMINDER: ${WECHAT_TEMPLATE_REMINDER:-}
      WECHAT_TEMPLATE_RESTRICTION: ${WECHAT_TEMPLATE_RESTRICTION:-}
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private_uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  migrate:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TEMPLATE_SUBMITTED: ${WECHAT_TEMPLATE_SUBMITTED:-}
      WECHAT_TEMPLATE_REVIEW: ${WECHAT_TEMPLATE_REVIEW:-}
      WECHAT_TEMPLATE_REMINDER: ${WECHAT_TEMPLATE_REMINDER:-}
      WECHAT_TEMPLATE_RESTRICTION: ${WECHAT_TEMPLATE_RESTRICTION:-}
    volumes:
      - private_uploads:/app/private_uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  uploads:
  private_uploads:
