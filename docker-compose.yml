services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shuyuan
      POSTGRES_USER: shuyuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shuyuan"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://space.example.edu.cn}
      REQUIRE_WORKER_HEARTBEAT: "true"
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TEMPLATE_SUBMITTED: ${WECHAT_TEMPLATE_SUBMITTED:-}
      WECHAT_TEMPLATE_REVIEW: ${WECHAT_TEMPLATE_REVIEW:-}
      WECHAT_TEMPLATE_REMINDER: ${WECHAT_TEMPLATE_REMINDER:-}
      WECHAT_TEMPLATE_RESTRICTION: ${WECHAT_TEMPLATE_RESTRICTION:-}
    volumes:
      - uploads:/app/uploads
      - private_uploads:/app/private_uploads
      - counselor_credentials:/app/credentials
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  migrate:
    build: ./backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_TEMPLATE_SUBMITTED: ${WECHAT_TEMPLATE_SUBMITTED:-}
      WECHAT_TEMPLATE_REVIEW: ${WECHAT_TEMPLATE_REVIEW:-}
      WECHAT_TEMPLATE_REMINDER: ${WECHAT_TEMPLATE_REMINDER:-}
      WECHAT_TEMPLATE_RESTRICTION: ${WECHAT_TEMPLATE_RESTRICTION:-}
    volumes:
      - private_uploads:/app/private_uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true

  ops:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: deploy/Dockerfile.ops
    environment:
      POSTGRES_BACKUP_URL: postgresql://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      DATABASE_URL: postgresql+asyncpg://shuyuan:${POSTGRES_PASSWORD}@db:5432/shuyuan
      BACKUP_DIR: /backups
      UPLOAD_DIR: /media/public
      PRIVATE_UPLOAD_DIR: /media/private
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_SOURCE_COMMIT: ${BACKUP_SOURCE_COMMIT:-unknown}
    volumes:
      - uploads:/media/public
      - private_uploads:/media/private
      - ${BACKUP_DIR:-./backups}:/backups
      - ${BACKUP_KEY_DIR:-./backup-keys}:/keys:ro

volumes:
  postgres_data:
  uploads:
  private_uploads:
  counselor_credentials:
