name: 缺陷报告
description: 报告可复现的页面、接口或部署问题（不要提交敏感信息）
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: 安全漏洞、令牌、密钥和真实个人信息请按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: 提交或版本
      placeholder: 例如 0acc1e9 或 v0.1.0-rc.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options: [微信小程序, 后端 API, 管理后台, 部署/运维, 文档/协作]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 最小复现步骤
      description: 使用虚构账号和脱敏数据，写明从哪个页面或接口开始。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可附状态码和脱敏日志，不要附 token、OpenID、手机号或照片。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      placeholder: 微信开发者工具/基础库/手机系统，或 Python/PostgreSQL/Docker 版本
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认内容不含真实姓名、学号、手机号、OpenID、照片、令牌、密钥或数据库数据
          required: true
