name: 改进建议
description: 提交有验收标准的产品或工程改进
title: "[Enhancement] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请先描述问题和证据，而不是只描述方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与取舍
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写出可观察、可测试的完成条件。
    validations:
      required: true
  - type: dropdown
    id: dependency
    attributes:
      label: 外部依赖
      options:
        - 无
        - 学校身份/服务器
        - 微信公众平台
        - 数据或隐私审批
        - 法务/许可证
    validations:
      required: true
