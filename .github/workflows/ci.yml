name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m compileall -q backend/app backend/tests backend/guards
      - run: python -m pytest -q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  miniprogram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json
      - run: npm ci
        working-directory: miniprogram
      - run: npm run check
        working-directory: miniprogram
      - run: npm run build:dev
        working-directory: miniprogram
      - uses: actions/upload-artifact@v4
        with:
          name: wechat-development-artifact
          path: dist/wechat

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --strict -r backend/requirements-dev.txt
      - run: pip-audit -r backend/requirements.txt --format cyclonedx-json --output backend/sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom
          path: backend/sbom.cdx.json

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag duxue-api:ci backend
