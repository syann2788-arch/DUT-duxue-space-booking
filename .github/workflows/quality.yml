name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile backend source
        run: python -m compileall -q app guards tests migrations

      - name: Verify handover documentation links
        run: python ../scripts/check-handover-docs.py

      - name: Verify Alembic upgrade from empty database
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/alembic-ci.db
          APP_ENV: development
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

      - name: Verify parallel pytest isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q > /tmp/pytest-a.log 2>&1 &
          pid_a=$!
          python -m pytest -q > /tmp/pytest-b.log 2>&1 &
          pid_b=$!
          status=0
          wait "$pid_a" || status=$?
          wait "$pid_b" || status=$?
          cat /tmp/pytest-a.log
          cat /tmp/pytest-b.log
          exit "$status"

  miniprogram-build:
    name: Miniprogram build policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test build policy
        run: npm test

      - name: Verify release and community baseline
        run: npm run release:check

      - name: Build reproducible development artifact
        env:
          RELEASE_VERSION: ci
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build:dev

      - name: Verify development artifact integrity
        run: node scripts/verify-miniprogram-build.mjs dist/miniprogram-development

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-development
          path: dist/miniprogram-development

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shuyuan_test
          POSTGRES_USER: shuyuan
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuyuan -d shuyuan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://shuyuan:test-password@127.0.0.1:5432/shuyuan_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q test_postgres_concurrency.py

  production-build:
    name: Miniprogram release artifact
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require approved production configuration
        env:
          MINIPROGRAM_API_BASE_URL: ${{ vars.MINIPROGRAM_API_BASE_URL }}
          MINIPROGRAM_APP_ID: ${{ vars.MINIPROGRAM_APP_ID }}
        run: |
          if [ -z "$MINIPROGRAM_API_BASE_URL" ] || [ -z "$MINIPROGRAM_APP_ID" ]; then
            echo "Repository variables MINIPROGRAM_API_BASE_URL and MINIPROGRAM_APP_ID are required for release tags."
            exit 1
          fi
      - name: Build production artifact from repository variables
        env:
          MINIPROGRAM_API_BASE_URL: ${{ vars.MINIPROGRAM_API_BASE_URL }}
          MINIPROGRAM_APP_ID: ${{ vars.MINIPROGRAM_APP_ID }}
          RELEASE_VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build:prod
      - name: Verify production artifact integrity
        run: node scripts/verify-miniprogram-build.mjs dist/miniprogram-production
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-production-${{ github.ref_name }}
          path: dist/miniprogram-production

      - name: Publish build summary
        run: |
          echo "## Release build $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Production artifact generated from commit $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "A build does not publish a Release; school acceptance and signatures must be verified separately." >> "$GITHUB_STEP_SUMMARY"

  handover-package:
    name: Handover package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test immutable handover exports and verification
        run: python scripts/test_handover_package.py
      - name: Export source candidate from the tested Git commit
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from package_handover import pack
          if '-rc.' in json.loads(Path('package.json').read_text())['version']:
              candidate_tag = os.environ['GITHUB_REF'].startswith('refs/tags/v') and '-rc.' in os.environ['GITHUB_REF']
              target = pack(ref=os.environ['GITHUB_SHA'], draft=not candidate_tag)
              print(target)
          else:
              print('Stable source packages require the separate controlled school acceptance record.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: handover-source-candidate
          path: dist/handover/
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit locked Python dependencies
        run: python -m pip_audit -r requirements.txt

  publish-candidate:
    name: Publish candidate Release
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc.')
    needs: [backend-tests, miniprogram-build, postgres-concurrency, handover-package, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export and verify the tested candidate tag
        run: |
          python scripts/package_handover.py pack --ref "$GITHUB_REF_NAME" --output dist/release-candidate
          python scripts/package_handover.py verify dist/release-candidate
      - name: Publish verified files as a pre-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const directory = 'dist/release-candidate';
            const tag = context.ref.replace('refs/tags/', '');
            const manifest = JSON.parse(fs.readFileSync(`${directory}/handover-manifest.json`, 'utf8')).record;
            if (tag !== `v${manifest.version}` || manifest.sourceCommit !== context.sha || manifest.tag !== tag || manifest.status !== 'pending-school-deployment-acceptance') {
              throw new Error('Candidate tag, source commit or handover status mismatch');
            }
            const names = ['source.zip', 'handover.zip', 'handover-manifest.json', 'SHA256SUMS'];
            const files = names.map(name => ({ name, data: fs.readFileSync(`${directory}/${name}`) }));
            const sums = files.find(file => file.name === 'SHA256SUMS').data.toString('utf8').trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '这是学校源码交付候选版，状态为**待部署验收**。学校服务器部署、微信发布和正式验收尚未完成。',
              `固定提交：\`${context.sha}\`；不可变标签：\`${tag}\`。`,
              `自动检查：[本次标签工作流](${runUrl})；后端、小程序、PostgreSQL 并发、依赖审计和交付包检查通过后才执行发布。`,
              '下载 source.zip 获取完整源码；handover.zip 包含同一份源码、使用/部署/微信/运维教程、配置模板及接收登记。另附逐文件清单 handover-manifest.json 和 SHA256SUMS。',
              `接收说明：[交付指南](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${tag}/docs/HANDOVER_GUIDE.md)。`,
              '没有附微信 production 构建包：学校实际 HTTPS API 地址尚未提供。AppSecret、真实账号、数据库和业务照片不包含在交付物中，须通过学校受控渠道交接。',
              '已知待办：可信注册与本人核验、学校生产配置与隐私/权利确认、真机及订阅消息验证、备份恢复与正式验收签字。AppID 已配置为 wx78c441ce72d765fc。',
              '数据库迁移目标为 20261002_03。生产禁止使用演示 seed；先备份、迁移、初始化基础数据及受控建号，再启动 API 和 worker。回滚依据 OPERATIONS_RUNBOOK.md 恢复数据库与媒体到同一备份点，不移动标签或执行破坏性 downgrade。',
              '交付文件 SHA-256：\n```text\n' + sums + '\n```',
              '此版本标记为 pre-release，不代表学校系统已验收或正式上线。'
            ].join('\n\n');
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              throw new Error('Release already exists; refuse to replace immutable assets');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, target_commitish: context.sha,
              name: `${tag} 学校源码交付候选版（待部署验收）`,
              body, draft: true, prerelease: true, make_latest: 'false'
            });
            try {
              for (const file of files) {
                const { data: asset } = await github.rest.repos.uploadReleaseAsset({
                  ...context.repo, release_id: release.id, name: file.name, data: file.data,
                  headers: { 'content-type': file.name.endsWith('.zip') ? 'application/zip' : 'application/octet-stream', 'content-length': file.data.length }
                });
                const expected = 'sha256:' + crypto.createHash('sha256').update(file.data).digest('hex');
                if (asset.state !== 'uploaded' || asset.size !== file.data.length || asset.digest && asset.digest !== expected) {
                  throw new Error(`Uploaded asset verification failed: ${file.name}`);
                }
              }
              const { data: published } = await github.rest.repos.updateRelease({
                ...context.repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'
              });
              core.notice(`Candidate published: ${published.html_url}`);
              await core.summary.addHeading('Candidate source handover published').addLink('Download pre-release', published.html_url).addRaw(`\n\nSource commit: ${context.sha}\n\nSchool deployment and acceptance remain pending.\n`).write();
            } catch (error) {
              // Only remove our own incomplete draft; never delete a public Release.
              const { data: current } = await github.rest.repos.getRelease({ ...context.repo, release_id: release.id });
              if (current.draft) await github.rest.repos.deleteRelease({ ...context.repo, release_id: release.id });
              throw error;
            }
