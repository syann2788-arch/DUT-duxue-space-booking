name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile backend source
        run: python -m compileall -q app guards tests migrations

      - name: Verify Alembic upgrade from empty database
        env:
          DATABASE_URL: sqlite+aiosqlite:////tmp/alembic-ci.db
          APP_ENV: development
        run: alembic upgrade head

      - name: Run tests
        run: python -m pytest -q

      - name: Verify parallel pytest isolation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q > /tmp/pytest-a.log 2>&1 &
          pid_a=$!
          python -m pytest -q > /tmp/pytest-b.log 2>&1 &
          pid_b=$!
          status=0
          wait "$pid_a" || status=$?
          wait "$pid_b" || status=$?
          cat /tmp/pytest-a.log
          cat /tmp/pytest-b.log
          exit "$status"

  miniprogram-build:
    name: Miniprogram build policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test build policy
        run: npm run test:build

      - name: Build reproducible development artifact
        env:
          RELEASE_VERSION: ci
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build:dev

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-development
          path: dist/miniprogram-development

  postgres-concurrency:
    name: PostgreSQL concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shuyuan_test
          POSTGRES_USER: shuyuan
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuyuan -d shuyuan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://shuyuan:test-password@127.0.0.1:5432/shuyuan_test
      SECRET_KEY: ci-only-secret-key-with-at-least-32-characters
      RUN_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q test_postgres_concurrency.py

  production-build:
    name: Miniprogram release artifact
    if: startsWith(github.ref, 'refs/tags/') && vars.MINIPROGRAM_APP_ID != '' && vars.MINIPROGRAM_API_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build production artifact from repository variables
        env:
          MINIPROGRAM_API_BASE_URL: ${{ vars.MINIPROGRAM_API_BASE_URL }}
          MINIPROGRAM_APP_ID: ${{ vars.MINIPROGRAM_APP_ID }}
          RELEASE_VERSION: ${{ github.ref_name }}
          GIT_COMMIT: ${{ github.sha }}
        run: npm run build:prod
      - uses: actions/upload-artifact@v4
        with:
          name: miniprogram-production-${{ github.ref_name }}
          path: dist/miniprogram-production

  dependency-audit:
    name: Dependency audit (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit

      - name: Audit locked Python dependencies
        run: python -m pip_audit -r requirements.txt
